name: Calcora AI Windows Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Full regression suite
        run: npm run verify

      - name: Build Windows NSIS and portable artifacts
        run: npm run dist:win

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path release -File -Filter *.exe
          if (-not $artifacts) { throw "No Windows .exe artifacts were generated in release/." }
          $installer = $artifacts | Where-Object { $_.Name -match '^Calcora-AI-.*-x64-setup\.exe$' }
          $portable = $artifacts | Where-Object { $_.Name -match '^Calcora-AI-.*-x64-portable\.exe$' }
          if (-not $installer) { throw "Expected x64 NSIS installer was not found in release/." }
          if (-not $portable) { throw "Expected x64 portable executable was not found in release/." }
          foreach ($artifact in @($installer) + @($portable)) {
            if ($artifact.Length -le 0) { throw "Artifact is empty: $($artifact.FullName)" }
          }
          $artifacts | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calcora-ai-windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
