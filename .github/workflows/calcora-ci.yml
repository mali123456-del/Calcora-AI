name: Calcora CI

on:
  push:
    branches: ["main", "feat/tutor-2-knowledge-grounding"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full production verification
        run: npm run verify

  windows-package:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows artifacts
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: calcora-windows
          path: |
            dist/*.exe
            dist/**/*.exe
            release/*.exe
            dist-electron/*.exe
          if-no-files-found: error
