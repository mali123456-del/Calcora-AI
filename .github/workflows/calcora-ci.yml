name: Calcora CI

on:
  push:
    branches: ["main", "feat/tutor-2-knowledge-grounding"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:core
      - run: npm run test:tutor
      - run: npm run test:intelligence
      - run: npm run test:learning
      - run: npm run build

  windows-package:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: calcora-windows
          path: |
            dist/*.exe
            dist/**/*.exe
            release/*.exe
            dist-electron/*.exe
          if-no-files-found: error
