name: Calcora AI Cross-Platform Verification

on:
  push:
    branches: [main, feat/tutor-2-knowledge-grounding]
  pull_request:
    branches: [main, feat/tutor-2-knowledge-grounding]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: dist:linux
          - os: windows-latest
            package: dist:win
          - os: macos-latest
            package: dist:mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full production verification
        run: npm run verify
      - name: Desktop packaging
        run: npm run ${{ matrix.package }}
