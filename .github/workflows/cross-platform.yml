name: Calcora AI Cross-Platform Verification

on:
  push:
    branches: [main, feat/tutor-2-knowledge-grounding]
  pull_request:
    branches: [main, feat/tutor-2-knowledge-grounding]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Advisory matrix entries (matrix.advisory) are allowed to fail without
    # failing the whole workflow; their conclusion remains visible per-job.
    continue-on-error: ${{ matrix.advisory == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: dist:linux
          - os: windows-latest
            package: dist:win
          # macos-latest targets the arm64 pool, which has recurring hosted-runner
          # capacity failures ("job was not acquired by Runner of type hosted").
          # The Intel x64 pool is a separate capacity domain and the label is
          # supported long-term; dist:mac then verifies the x64 dmg/zip artifacts.
          - os: macos-15-intel
            package: dist:mac
          # Advisory Apple-silicon (arm64) packaging attempt. The arm64 hosted
          # runner pool has recurring capacity failures; continue-on-error keeps
          # the attempt visible (a green check when it actually runs and passes,
          # an acknowledged failure when the pool is unavailable) without making
          # arm64 pool capacity a blocker for the gate. A success here is real
          # Apple-silicon packaging evidence; a capacity failure is honestly
          # reported as unverified packaging, never as a pass.
          - os: macos-15
            package: dist:mac
            advisory: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full production verification
        run: npm run verify
      - name: Desktop packaging
        run: npm run ${{ matrix.package }}
